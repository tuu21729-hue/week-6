html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Number Generator</title>
</head>
<body>

    <!-- 1. The Button -->
    <button id="generateBtn">Generate Random Number</button>

    <!-- 2. Where the number will be printed -->
    <p>Your number: <span id="numberDisplay">0</span></p>

    <!-- 3. The JavaScript -->
    <script>
        // Select the button and the display elements from the DOM
        const button = document.getElementById('generateBtn');
        const display = document.getElementById('numberDisplay');
         const midiPitches = [60, 62, 63, 67, 69, 72, 36, 38];

         const randomPitch = function() 
        
        {
    // Pick a random MIDI note number from the midiPitches array
    let randoMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];

    // Convert the MIDI note number to frequency (Hz) using the formula
    // MIDI note 69 = A4 = 440 Hz, each semitone is 2^(1/12) times higher
    let newFreq = 440 * 2 ** ((randoMidiNote - 69) / 12);

    // Return the frequency value so it can be used in sound synthesis
    return newFreq;

          button.addEventListener('click', () => { randomPitch();
            
         display.textContent = newFreq;}

        

      
        });
    </script>

</body>
</html>
