<!DOCTYPE html>
<html lang = "en">
<meta charset="UTF-8">
<title>ADSR_Works</title>
</head>
<body>

 
    <button id = "Button1"> Play1st</button>
    <button id = "Button2"> Play2nd</button>
<button id = "Button3"> Play3rd</button>
<button id = "Button4"> Play4th</button>

    <script>
        function playNote1(someContext1, frequency1, duration1)
        {
            const osc1 = new OscillatorNode(someContext1);
            const osc2 = new OscillatorNode(someContext1);
            const gain1 = new GainNode(someContext1);
        
            
            osc1.frequency.value = frequency1;
            osc2.frequency.value = frequency1*2.01;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain1.gain.value = 0;

            osc1.connect(gain1).connect(someContext1.destination);
            osc2.connect(gain1 ).connect(someContext1.destination);

            let now1 = someContext1.currentTime;

            gain1.gain.linearRampToValueAtTime(0.30, now1 + (duration1*0.01)); //attack
            gain1.gain.linearRampToValueAtTime(0.10, now1 + (duration1*0.01) + (duration1*0.08)); //decay
            gain1.gain.linearRampToValueAtTime(0.30, now1 + (duration1*0.01) + (duration1*0.08) + (duration1*0.9));
            gain1.gain.linearRampToValueAtTime(0, now1 + duration1); //release

            osc1.start();
            osc1.stop(now1 + duration1);

            osc2.start();
            osc2.stop(now1 + duration1);

        }

  const myCtx1 = new AudioContext();
        let freq1 = 220
        let duration1 = 5

        document.querySelector("#Button1").onclick = () => playNote1(myCtx1, freq1, duration1);
